<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>QAssist session capture</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 320px;
    margin: 0;
    padding: 12px 14px 14px;
    color: #1f2430;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e5e7eb; background: #16181d; }
  }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
  p { margin: 0 0 10px; }
  .muted { color: #6b7280; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  textarea, input[type='text'] {
    width: 100%;
    font: inherit;
    padding: 6px 8px;
    margin-bottom: 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: transparent;
    color: inherit;
  }
  textarea { resize: vertical; min-height: 64px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  button {
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #f3f4f6;
    color: #1f2430;
  }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 4px; }
  .error { color: #b91c1c; margin-bottom: 8px; }
  .box {
    padding: 8px 10px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 10px;
    background: rgba(127, 127, 127, 0.06);
  }
  .email { font-weight: 600; }
  a.link { cursor: pointer; color: #2563eb; text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  label.check { display: flex; align-items: flex-start; gap: 6px; cursor: pointer; margin-bottom: 10px; }
  label.check input { margin-top: 3px; }
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
