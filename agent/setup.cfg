[mutmut]
# Mutation audit for the agent's pure logic (US-034): seed one-line defects into
# the tested modules and confirm the pytest suite catches each. Only the
# stdlib-only, unit-tested modules are mutated — run_agent.py / make_report.py
# pull in browser-use/Playwright and have no unit tests to react to a mutation.
# Run from agent/ with: .venv/bin/mutmut run   (then: mutmut results)
source_paths=
    redact.py
    report_format.py
    email_codes.py
also_copy=
    tests/
    pytest.ini
# email_codes.py mixes tested pure parsers with an untested IMAP network class;
# mutating only test-covered lines drops the network glue (which would report as
# "no tests" noise) and keeps the audit on logic a test could actually catch.
mutate_only_covered_lines=true
