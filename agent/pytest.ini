[pytest]
# Agent unit tests. `pythonpath = .` puts agent/ on sys.path so a test can
# `import email_codes` without a package install — the scripts run the same
# way, invoked by path from the server. Kept to modules that import on stdlib
# alone (email_codes); run_agent pulls in browser-use, and covering it is US-034.
#
# One exception: test_report_diagnostics.py imports make_report, which imports
# Playwright (US-044). Importing it launches no browser and touches no network —
# the test asserts on build_html's HTML, not on a rendered PDF — so the suite
# stays hermetic and instant. It does mean this file needs the agent venv, which
# is how the suite is run anyway.
testpaths = tests
pythonpath = .
