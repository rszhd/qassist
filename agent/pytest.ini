[pytest]
# Agent unit tests. `pythonpath = .` puts agent/ on sys.path so a test can
# `import email_codes` without a package install — the scripts run the same
# way, invoked by path from the server. Kept to modules that import on stdlib
# alone (email_codes); run_agent pulls in browser-use, and covering it is US-034.
#
# test_report_diagnostics.py imports make_report, and that stays inside the rule
# rather than excepting itself from it: make_report imports Playwright inside
# main(), so everything the test touches — build_html and report_format — is
# stdlib. US-044 filed it as an exception on the reasoning that importing
# Playwright launches nothing, which is true and beside the point; the CI job
# installs pytest alone, so the import failed at collection and took the whole
# suite with it (exit 2, not one red test). Found at merge-to-staging.
testpaths = tests
pythonpath = .
